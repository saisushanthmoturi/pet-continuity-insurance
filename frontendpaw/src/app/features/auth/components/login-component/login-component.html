<div class="min-h-[80vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md bg-white border border-[#EAE5DF] rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-[#75013F] flex items-center justify-center shadow-sm mb-3">
        <span class="text-white font-bold text-xl">P</span>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-[#000000]">Sign In to Your Account</h2>
      <p class="text-xs text-gray-500 mt-1">Enter your credentials to manage pet assurance policies</p>
    </div>

    <!-- Quick Role Switcher for Demo -->
    <div class="mb-6 bg-[#FAFAFA] p-3 rounded-xl border border-[#EAE5DF]">
      <div class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2 text-center">
        Demo Quick Credentials
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-xs">
        <button
          type="button"
          (click)="fillDemo('customer')"
          class="py-1.5 px-2 rounded-lg bg-white border border-[#EAE5DF] hover:border-[#75013F] text-gray-700 font-medium hover:text-[#75013F] transition-all text-center">
          Customer
        </button>
        <button
          type="button"
          (click)="fillDemo('underwriter')"
          class="py-1.5 px-2 rounded-lg bg-white border border-[#EAE5DF] hover:border-[#75013F] text-gray-700 font-medium hover:text-[#75013F] transition-all text-center">
          Underwriter
        </button>
        <button
          type="button"
          (click)="fillDemo('claims')"
          class="py-1.5 px-2 rounded-lg bg-white border border-[#EAE5DF] hover:border-[#75013F] text-gray-700 font-medium hover:text-[#75013F] transition-all text-center">
          Claims Adjuster
        </button>
        <button
          type="button"
          (click)="fillDemo('caretaker')"
          class="py-1.5 px-2 rounded-lg bg-white border border-[#EAE5DF] hover:border-[#75013F] text-gray-700 font-medium hover:text-[#75013F] transition-all text-center">
          Caretaker
        </button>
        <button
          type="button"
          (click)="fillDemo('admin')"
          class="py-1.5 px-2 rounded-lg bg-white border border-[#EAE5DF] hover:border-[#75013F] text-gray-700 font-medium hover:text-[#75013F] transition-all text-center col-span-2 sm:col-span-1">
          Admin
        </button>
      </div>
    </div>

    <!-- Error Alert -->
    <div *ngIf="(loginStatus$ | async)?.error as errorMsg" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          [(ngModel)]="email"
          placeholder="e.g. john.doe@example.com"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all" />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="password"
          placeholder="Enter password"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all" />
      </div>

      <button
        type="submit"
        id="login-submit-button"
        [disabled]="(loginStatus$ | async)?.loading"
        class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#75013F] hover:bg-[#FE3082] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#75013F] transition-all shadow-sm disabled:opacity-50">
        <span *ngIf="!(loginStatus$ | async)?.loading">Sign In</span>
        <span *ngIf="(loginStatus$ | async)?.loading">Signing in...</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      Need a pet continuity account?
      <a routerLink="/auth/register" class="font-semibold text-[#75013F] hover:text-[#FE3082] ml-1 transition-colors">Register</a>
    </div>
  </div>
</div>
