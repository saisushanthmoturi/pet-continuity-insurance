<div class="min-h-[80vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md bg-white border border-[#EAE5DF] rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-br from-[#75013F] to-[#9E0B54] flex items-center justify-center shadow-sm mb-3">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="4.5" cy="9.5" r="2.1"/>
          <circle cx="9.2" cy="5.2" r="2.2"/>
          <circle cx="14.8" cy="5.2" r="2.2"/>
          <circle cx="19.5" cy="9.5" r="2.1"/>
          <path d="M12 11c-2.9 0-5.3 1.9-5.3 4.3 0 2.1 1.9 3.7 4 3.7.4 0 .9-.1 1.3-.3.4.2.9.3 1.3.3 2.1 0 4-1.6 4-3.7 0-2.4-2.4-4.3-5.3-4.3z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-[#000000]">Create an Account</h2>
      <p class="text-xs text-gray-500 mt-1">Register to secure lifelong continuity care for your pets</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="(signupStatus$ | async)?.error as errorMsg" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="fullName" class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          required
          [(ngModel)]="fullName"
          placeholder="e.g. Alex Morgan"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all" />
      </div>

      <div>
        <label for="regEmail" class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
        <input
          id="regEmail"
          name="regEmail"
          type="email"
          required
          [(ngModel)]="email"
          placeholder="e.g. alex.morgan@example.com"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all" />
      </div>

      <div>
        <label for="regPassword" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input
          id="regPassword"
          name="regPassword"
          type="password"
          required
          [(ngModel)]="password"
          placeholder="Choose secure password"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all" />
      </div>

      <div>
        <label for="role" class="block text-xs font-semibold text-gray-700 mb-1">Account Role</label>
        <select
          id="role"
          name="role"
          [(ngModel)]="role"
          class="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#75013F] focus:border-transparent transition-all bg-white">
          <option value="CUSTOMER">Pet Owner / Customer</option>
          <option value="UNDERWRITER">Underwriting Risk Officer</option>
          <option value="CLAIMS_ADJUSTER">Claims Adjuster</option>
          <option value="ADMIN">System Administrator</option>
        </select>
      </div>

      <button
        type="submit"
        id="register-submit-button"
        [disabled]="(signupStatus$ | async)?.loading"
        class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#75013F] hover:bg-[#FE3082] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#75013F] transition-all shadow-sm disabled:opacity-50">
        <span *ngIf="!(signupStatus$ | async)?.loading">Complete Registration</span>
        <span *ngIf="(signupStatus$ | async)?.loading">Registering...</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      Already registered?
      <a routerLink="/auth/login" class="font-semibold text-[#75013F] hover:text-[#FE3082] ml-1 transition-colors">Sign In</a>
    </div>
  </div>
</div>
