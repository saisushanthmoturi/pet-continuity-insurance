server:
  port: 8081

spring:
  application:
    name: AuthService
  r2dbc:
    url: r2dbc:mysql://localhost:3306/auth_db
    username: root
    password: ""
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      cors:
        allowed-origins:
          - "http://localhost:4200"
          - "http://localhost:4201"
          - "http://localhost:4202"
          - "http://localhost:4203"
          - "http://localhost:4204"
          - "http://localhost:4205"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers: "*"
        allow-credentials: true
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
