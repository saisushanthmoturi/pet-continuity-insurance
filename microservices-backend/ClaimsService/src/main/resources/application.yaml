server:
  port: 8086

spring:
  application:
    name: ClaimsService
  r2dbc:
    url: r2dbc:mysql://localhost:3306/claims_db
    username: root
    password: ""
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      cors:
        allowed-origins:
          - "http://localhost:4200"
          - "http://localhost:4201"
          - "http://localhost:4202"
          - "http://localhost:4203"
          - "http://localhost:4204"
          - "http://localhost:4205"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers: "*"
        allow-credentials: true
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
