server:
  port: 8761

spring:
  application:
    name: EurekaServer

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allowed-origins:
          - "http://localhost:4200"
          - "http://localhost:4201"
          - "http://localhost:4202"
        allowed-methods:
          - GET
          - POST
          - OPTIONS
        allowed-headers: "*"
        allow-credentials: true
